<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — Mentions Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --slack-purple: #4A154B;
      --slack-green: #2BAC76;
      --text: #1d1c1d;
      --muted: #616061;
      --border: #e8e8e8;
      --bg: #f8f8f8;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border);
      background: white;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 36px; height: 36px;
      background: var(--slack-purple);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo svg { width: 20px; height: 20px; fill: white; }
    .logo-name { font-size: 16px; font-weight: 600; }
    main {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 3rem 1.5rem;
    }
    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
    }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 0.5rem; }
    .greeting { font-size: 15px; color: var(--muted); margin-bottom: 2rem; }

    /* Sign in state */
    .signin-prompt { text-align: center; }
    .signin-prompt p { font-size: 15px; color: var(--muted); margin-bottom: 1.5rem; }
    .signin-btn {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--slack-purple); color: white;
      text-decoration: none; font-size: 15px; font-weight: 500;
      padding: 12px 24px; border-radius: 10px;
      transition: background 0.15s;
    }
    .signin-btn:hover { background: #611f64; }
    .signin-btn svg { width: 20px; height: 20px; fill: white; }

    /* Mode selector */
    .mode-options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 1.5rem; }
    .mode-option {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 16px; border: 2px solid var(--border);
      border-radius: 12px; cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .mode-option:hover { border-color: #ccc; }
    .mode-option.active { border-color: var(--slack-purple); background: #faf5fa; }
    .mode-option input { display: none; }
    .radio {
      width: 20px; height: 20px; border: 2px solid #ccc;
      border-radius: 50%; flex-shrink: 0; margin-top: 2px;
      display: flex; align-items: center; justify-content: center;
    }
    .mode-option.active .radio { border-color: var(--slack-purple); }
    .mode-option.active .radio::after {
      content: ''; width: 10px; height: 10px;
      background: var(--slack-purple); border-radius: 50%;
    }
    .mode-label { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .mode-desc { font-size: 13px; color: var(--muted); line-height: 1.5; }

    .save-btn {
      width: 100%; padding: 12px; font-size: 15px; font-weight: 500;
      background: var(--slack-purple); color: white;
      border: none; border-radius: 10px; cursor: pointer;
      transition: background 0.15s;
    }
    .save-btn:hover { background: #611f64; }
    .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .status {
      margin-top: 1rem; font-size: 14px; text-align: center;
      padding: 10px; border-radius: 8px; display: none;
    }
    .status.success { display: block; background: #e6f7ef; color: #1a7f4b; }
    .status.error { display: block; background: #fde8e8; color: #b91c1c; }

    footer {
      text-align: center; padding: 1.5rem;
      font-size: 13px; color: #bbb;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M6 15a2 2 0 0 1-2 2 2 2 0 0 1-2-2 2 2 0 0 1 2-2h2v2zm1 0a2 2 0 0 1 2-2 2 2 0 0 1 2 2v5a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-5zm2-8a2 2 0 0 1-2-2 2 2 0 0 1 2-2 2 2 0 0 1 2 2v2H9zm0 1a2 2 0 0 1 2 2 2 2 0 0 1-2 2H4a2 2 0 0 1-2-2 2 2 0 0 1 2-2h5zm8 2a2 2 0 0 1 2-2 2 2 0 0 1 2 2 2 2 0 0 1-2 2h-2v-2zm-1 0a2 2 0 0 1-2 2 2 2 0 0 1-2-2V5a2 2 0 0 1 2-2 2 2 0 0 1 2 2v5zm-2 8a2 2 0 0 1 2 2 2 2 0 0 1-2 2 2 2 0 0 1-2-2v-2h2zm0-1a2 2 0 0 1-2-2 2 2 0 0 1 2-2h5a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-5z"/>
    </svg>
  </div>
  <span class="logo-name">Mentions Bot</span>
</header>

<main>
  <div class="card">
    <!-- Sign in screen -->
    <div id="signin-view" style="display: none;">
      <div class="signin-prompt">
        <h1>Settings</h1>
        <p>Sign in with Slack to manage your notification preferences.</p>
        <a href="/api/auth/signin" class="signin-btn">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 15a2 2 0 0 1-2 2 2 2 0 0 1-2-2 2 2 0 0 1 2-2h2v2zm1 0a2 2 0 0 1 2-2 2 2 0 0 1 2 2v5a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-5zm2-8a2 2 0 0 1-2-2 2 2 0 0 1 2-2 2 2 0 0 1 2 2v2H9zm0 1a2 2 0 0 1 2 2 2 2 0 0 1-2 2H4a2 2 0 0 1-2-2 2 2 0 0 1 2-2h5zm8 2a2 2 0 0 1 2-2 2 2 0 0 1 2 2 2 2 0 0 1-2 2h-2v-2zm-1 0a2 2 0 0 1-2 2 2 2 0 0 1-2-2V5a2 2 0 0 1 2-2 2 2 0 0 1 2 2v5zm-2 8a2 2 0 0 1 2 2 2 2 0 0 1-2 2 2 2 0 0 1-2-2v-2h2zm0-1a2 2 0 0 1-2-2 2 2 0 0 1 2-2h5a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-5z"/>
          </svg>
          Sign in with Slack
        </a>
      </div>
    </div>

    <!-- Settings screen -->
    <div id="settings-view" style="display: none;">
      <h1>Notification Settings</h1>
      <p class="greeting">Hi <strong id="user-name"></strong>, choose how you'd like to be notified.</p>

      <div class="mode-options">
        <label class="mode-option" data-mode="realtime">
          <input type="radio" name="mode" value="realtime" />
          <div class="radio"></div>
          <div>
            <div class="mode-label">Real-time</div>
            <div class="mode-desc">Get a DM instantly whenever someone mentions you.</div>
          </div>
        </label>
        <label class="mode-option" data-mode="daily">
          <input type="radio" name="mode" value="daily" />
          <div class="radio"></div>
          <div>
            <div class="mode-label">Daily digest</div>
            <div class="mode-desc">Receive a summary of all your mentions at 9:00 AM UTC each day.</div>
          </div>
        </label>
      </div>

      <button class="save-btn" id="save-btn" disabled>Save preference</button>
      <div id="status" class="status"></div>
    </div>
  </div>
</main>

<footer>Mentions Bot · Built with the Slack Events API</footer>

<script>
  const params = new URLSearchParams(window.location.search);
  const teamId = params.get('team');
  const userId = params.get('user');
  const userName = params.get('name');

  if (teamId && userId) {
    // Signed in — show settings
    document.getElementById('settings-view').style.display = 'block';
    document.getElementById('user-name').textContent = decodeURIComponent(userName || 'there');

    // Clean URL
    window.history.replaceState({}, '', window.location.pathname);

    // Load current preference
    fetch(`/api/settings?team=${teamId}&user=${userId}`)
      .then(r => r.json())
      .then(data => {
        selectMode(data.mode);
      });

    // Mode selection
    const options = document.querySelectorAll('.mode-option');
    let selectedMode = null;

    function selectMode(mode) {
      selectedMode = mode;
      options.forEach(opt => {
        const isActive = opt.dataset.mode === mode;
        opt.classList.toggle('active', isActive);
        opt.querySelector('input').checked = isActive;
      });
    }

    options.forEach(opt => {
      opt.addEventListener('click', () => {
        selectMode(opt.dataset.mode);
        document.getElementById('save-btn').disabled = false;
        document.getElementById('status').className = 'status';
      });
    });

    // Save
    document.getElementById('save-btn').addEventListener('click', async () => {
      const btn = document.getElementById('save-btn');
      const status = document.getElementById('status');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        const res = await fetch(`/api/settings?team=${teamId}&user=${userId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ team: teamId, user: userId, mode: selectedMode }),
        });
        const data = await res.json();
        if (data.ok) {
          status.textContent = 'Preference saved!';
          status.className = 'status success';
        } else {
          throw new Error(data.error);
        }
      } catch (e) {
        status.textContent = 'Failed to save. Please try again.';
        status.className = 'status error';
      }
      btn.textContent = 'Save preference';
      btn.disabled = false;
    });
  } else {
    // Not signed in — show sign in button
    document.getElementById('signin-view').style.display = 'block';
  }
</script>

</body>
</html>
